baseURL = 'https://newmoonstudio.pages.dev/'
defaultContentLanguage = 'en'
locale = 'en'
title = 'Soft Moon Studio'
theme = 'dream'

[params]
  lightTheme = 'emerald'
  darkTheme = 'forest'
  author = 'Julia'
  headerTitle = 'Soft Moon Studio'
  description = 'Notes, ideas and stories from Soft Moon Studio.'
  avatar = 'img/soft-moon-logo.png'
  siteStartYear = 2026
  showPrevNextPost = true
  imageZoomableInPost = true
  reorderNavItems = ['about', 'search']

[params.advanced]
  customCSS = ['css/custom.css']
  customJS = []

[menus]
  [[menus.main]]
    name = 'Blog'
    pageRef = '/posts'
    weight = 10
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 20
