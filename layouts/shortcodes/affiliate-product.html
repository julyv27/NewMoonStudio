<aside class="softmoon-affiliate-product not-prose">
  <p class="softmoon-affiliate-eyebrow">Soft Moon Studio pick</p>
  <div class="softmoon-affiliate-product-layout{{ if not (.Get "image") }} softmoon-affiliate-product-layout-text-only{{ end }}">
    {{ with .Get "image" }}
      <figure class="softmoon-affiliate-product-image">
        <img src="{{ . }}" alt="{{ $.Get "imageAlt" }}" loading="lazy" />
        <figcaption>{{ with $.Get "imageLabel" }}{{ . }}{{ else }}Lifestyle inspiration{{ end }}</figcaption>
      </figure>
    {{ end }}
    <div>
      <h3>{{ .Get "title" }}</h3>
      {{ with .Get "whyFits" }}
        <p><strong>Why it fits:</strong> {{ . }}</p>
      {{ end }}
      <a class="softmoon-affiliate-button" href="{{ .Get "url" }}" target="_blank" rel="nofollow noopener sponsored">
        {{ with .Get "cta" }}{{ . }}{{ else }}View on Amazon{{ end }}
      </a>
      <p class="softmoon-affiliate-link-note">Affiliate link</p>
    </div>
  </div>
</aside>
