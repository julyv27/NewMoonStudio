<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Two black cordless table lamps with flat disc shades</title>
  <desc id="desc">Original product illustration based on the proportions and materials of the linked KDG two-pack.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7c8b8"/>
      <stop offset="1" stop-color="#a98d76"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#765039"/>
      <stop offset="1" stop-color="#3f291f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="0.5" stop-color="#37393c"/>
      <stop offset="1" stop-color="#0a0b0c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd892" stop-opacity=".82"/>
      <stop offset="1" stop-color="#ffd892" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#24170f" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#wall)"/>
  <rect y="785" width="1200" height="415" fill="#554034"/>
  <rect x="274" y="352" width="652" height="566" rx="78" fill="#927a67"/>
  <path d="M230 642 Q600 560 970 642 L1040 1035 H160 Z" fill="#d9c9b6"/>
  <path d="M170 850 Q600 760 1030 850 L1080 1110 H120 Z" fill="#c5ad94"/>
  <rect x="44" y="706" width="262" height="304" rx="9" fill="url(#wood)"/>
  <rect x="894" y="706" width="262" height="304" rx="9" fill="url(#wood)"/>
  <ellipse cx="175" cy="718" rx="172" ry="124" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="1025" cy="718" rx="172" ry="124" fill="url(#glow)" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <g transform="translate(175 0)">
      <ellipse cx="0" cy="828" rx="82" ry="23" fill="#090a0b"/>
      <rect x="-76" y="802" width="152" height="27" rx="12" fill="url(#metal)"/>
      <rect x="-11" y="437" width="22" height="373" rx="10" fill="url(#metal)"/>
      <ellipse cx="0" cy="444" rx="109" ry="23" fill="#0a0b0c"/>
      <rect x="-109" y="421" width="218" height="24" rx="11" fill="url(#metal)"/>
      <rect x="-96" y="445" width="192" height="12" rx="6" fill="#efbd69" opacity=".92"/>
      <ellipse cx="0" cy="457" rx="88" ry="13" fill="#ffd98d" opacity=".7"/>
    </g>
    <g transform="translate(1025 0)">
      <ellipse cx="0" cy="828" rx="82" ry="23" fill="#090a0b"/>
      <rect x="-76" y="802" width="152" height="27" rx="12" fill="url(#metal)"/>
      <rect x="-11" y="437" width="22" height="373" rx="10" fill="url(#metal)"/>
      <ellipse cx="0" cy="444" rx="109" ry="23" fill="#0a0b0c"/>
      <rect x="-109" y="421" width="218" height="24" rx="11" fill="url(#metal)"/>
      <rect x="-96" y="445" width="192" height="12" rx="6" fill="#efbd69" opacity=".92"/>
      <ellipse cx="0" cy="457" rx="88" ry="13" fill="#ffd98d" opacity=".7"/>
    </g>
  </g>
</svg>
